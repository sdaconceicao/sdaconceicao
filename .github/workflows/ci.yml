name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Decap commits straight to master, so pushes can arrive in bursts. Cancelling
# superseded runs keeps that from queueing up builds nobody is waiting on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        # No version input: it reads packageManager from package.json, which is
        # the deterministic source of truth.
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm the GitHub profile README is intact
        # This repo is named after the account, so README.md renders on the
        # GitHub profile. Cheap insurance against a scaffolder eating it.
        run: test -s README.md

      - name: Check formatting and lint rules
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests with coverage thresholds
        run: pnpm test:coverage

      - name: Build production site
        # The most valuable check here: this runs zod across every content entry,
        # so a malformed CMS commit fails before Vercel can serve it.
        run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
