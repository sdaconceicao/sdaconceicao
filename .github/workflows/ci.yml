name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, v2]

# Decap commits straight to master, so pushes can arrive in bursts. Cancelling
# superseded runs keeps that from queueing up builds nobody is waiting on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit test, build, end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm the GitHub profile README is intact
        run: test -s README.md

      - name: Check formatting and lint rules
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run unit tests with coverage thresholds
        run: pnpm test:coverage

      - name: Build production site
        # The most valuable check here: this runs zod across every content entry,
        # so a malformed CMS commit fails before Vercel can serve it.
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
